name: klt signoff

# The T1 state of this block is graded, not hand-read: the committed
# verdict of record (manifests/asap7-ucie-phy.signoff.json) must still
# reproduce from the committed block manifest
# (manifests/asap7-ucie-phy.json) under the klayout-tools version pinned in
# .github/klt-version. Every committed JSON project record must parse --
# verification/check-records-json.sh, the single copy of that gate, over the
# whole tracked record set (not just manifests/) -- and every record added or
# changed by this event's commit range must additionally be free of new
# absolute host paths (the forward-only gate, #172 /
# spec/decisions/0012-record-path-hygiene-gate.md).

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The forward-only record gate (#172) diffs the changed-record
          # range between this event's base commit and HEAD, so the base
          # must be fetchable: pull_request.base.sha (pull_request),
          # github.event.before (push) or merge_group.base_sha
          # (merge_group) is absent from a depth-1 clone, and the gate
          # would fail -- loudly, but for a reason a checkout setting
          # prevents.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt and the klayout module the pad self-test imports
        run: pip install "klayout-tools==$(cat .github/klt-version)" "klayout==$(cat .github/klayout-version)"

      # Every tracked spec/decisions/*.md must be in the item-10 inventory's
      # .hygiene list, else the envelope does not bind it (#319). Needs only
      # jq and git, so it runs before the klt-dependent gates.
      - name: Gate that every decision record is in the item-10 inventory
        run: |
          bash verification/test-check-decisions-inventoried.sh
          bash verification/check-decisions-inventoried.sh

      # The single copy of the JSON-validity gate: the pinned klt
      # env-provenance validity gate over every tracked JSON record, wherever
      # it lives. Passes on exit 0 and 3 (3 = the pre-existing absolute-path
      # findings, #172), fails on 1 (some record does not parse), 2 and
      # anything else. It runs after the klt install because the gate needs
      # the pinned tool.
      - name: Validate committed JSON records parse (whole tracked record set)
        run: bash verification/check-records-json.sh

      # The forward-only gate (#172, spec/decisions/0012): every record
      # added or changed by this event's commit range is gated on BOTH klt
      # env-provenance checks, and exit 3 is fatal for those records. The
      # whole-set run above stays validity-only (#166's contract); this gate
      # never re-lints frozen history. It fails rather than passes when the
      # changed-record list cannot be computed (no resolvable base, empty
      # range, broken record-set rule) -- no vacuous pass.
      - name: Selftest the record-gate base resolver (hermetic temp repos)
        run: bash verification/test-resolve-record-base.sh

      # The stream-splitter half of the record gate: byte-exact per-document
      # slices of changed multi-document records (the #308 CRLF regression
      # class), fail-closed rejection of every invalid stream shape, and the
      # fail-closed splitter leg of --changed (#324). Hermetic -- a stubbed
      # klt on PATH, temp git repos, no network -- so it needs none of the
      # installed toolchain below.
      - name: Selftest the JSON stream splitter (hermetic fixtures)
        run: bash verification/test-stream-walker.sh

      # The base the forward-only gate diffs against, resolved by the single
      # copy of that logic (verification/resolve-record-base.sh): the
      # pull_request base, else the push "before" SHA, else (dispatch or an
      # event without a base) the last commit -- while a merge_group run
      # resolves github.event.merge_group.base_sha and fails closed rather
      # than silently gating one commit of the queue's trial merge.
      - name: Resolve the base commit the forward-only record gate diffs against
        id: record-base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base="$(bash verification/resolve-record-base.sh)"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Gate records added or changed by this commit range (forward-only, #172)
        env:
          RECORD_BASE: ${{ steps.record-base.outputs.base }}
        run: bash verification/check-records-json.sh --changed --base "$RECORD_BASE"

      # klt signoff --check exits 0 when the committed report still
      # reproduces, 3 when it has drifted, anything else is an error.
      - name: Check the committed verdict of record still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/asap7-ucie-phy.json \
                      --check manifests/asap7-ucie-phy.signoff.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::manifests/asap7-ucie-phy.signoff.json no longer reproduces from manifests/asap7-ucie-phy.json. Read the drift above before choosing a fix — there are two different causes with two different fixes."
            echo "CAUSE 1 -- the cited EVIDENCE is stale, not the verdict. Tell: the drift lists 'stale_evidence' rows, or a status flipping from met to unmet, or a falling t1_met_count."
            echo "  Re-attest the stale evidence; do NOT regenerate the verdict, which would only record the drift as the verdict of record (and the next step would fail anyway)."
            echo "  Most often this is T1 item 10, whose inventoried members include README.md and .github/workflows/signoff.yml -- see manifests/t1-item10-inventory.json for the full list:"
            echo "    uv run --no-project --with \"klayout-tools==\$(cat .github/klt-version)\" --with \"klayout==\$(cat .github/klayout-version)\" klt signoff --attest 10 --inventory manifests/t1-item10-inventory.json -o manifests/t1-item10.envelope.json"
            echo "  Exception: if item 10 is stale because the inventory itself (manifests/t1-item10-inventory.json) changed, the re-attest above is still required -- it rewrites the envelope's provenance.input.content_hash -- but it is not sufficient: also update item 10's content_hash in manifests/asap7-ucie-phy.json to the new sha256 of the inventory, then regenerate the verdict (CAUSE 2's command). If the envelope was already re-attested, only the re-pin and the regeneration remain."
            echo "CAUSE 2 -- the verdict itself is stale (the manifest changed and the evidence is fine). Regenerate and commit it in this PR:"
            echo "    uvx --from \"klayout-tools==\$(cat .github/klt-version)\" klt signoff --manifest manifests/asap7-ucie-phy.json --format json > manifests/asap7-ucie-phy.signoff.json"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --check exited $rc (expected 0 or 3): manifest or report is broken"
            exit 1
          fi

      # A pin that has drifted from its evidence grades stale_evidence, which
      # --check happily reproduces. Fail on any such row in the committed verdict.
      - name: Fail if the committed verdict has stale evidence
        run: |
          if jq -e 'any(.items[]; .reason == "stale_evidence")' manifests/asap7-ucie-phy.signoff.json >/dev/null; then
            echo "::error::the committed verdict has stale_evidence rows: re-pin the cited evidence in manifests/asap7-ucie-phy.json and regenerate the verdict"
            jq -c '.items[] | select(.reason == "stale_evidence") | [.id, .partition]' manifests/asap7-ucie-phy.signoff.json
            exit 1
          fi

      - name: Check all inventory-based T1 attestations cited by the block manifest
        shell: python
        run: |
          import json
          import shlex
          import subprocess
          import sys
          from pathlib import Path


          def repo_file(name):
              if not isinstance(name, str):
                  sys.exit(f"::error::Expected a repository file path, got {name!r}")
              path = Path(name)
              if path.is_absolute() or not path.is_file() or not path.resolve().is_relative_to(Path.cwd()):
                  sys.exit(f"::error::Expected a file in the repository at {name!r}")
              return name


          def query(path, expression):
              # Use the repository's stream validator before jq can normalize invalid JSON.
              # Its input is one path per line. An open descriptor also handles names containing newlines.
              validate = 'source verification/check-records-json.sh && validate_stream 3<"$1" <<< /dev/fd/3'
              result = subprocess.run(
                  ["bash", "-c", validate, "validate_stream", path], stdout=subprocess.DEVNULL, check=False
              )
              if result.returncode:
                  sys.exit(f"::error::Invalid JSON document stream in {path!r}")
              return json.loads(subprocess.check_output(["jq", "-ces", expression, "./" + path]))


          manifest = "manifests/asap7-ucie-phy.json"
          files = query(manifest, '[.[].evidence | .. | objects | select(has("file")) | .file] | unique')
          attested = "map(objects | select(.attestation.inventory_schema_version != null))"
          checks = []
          for envelope in files:
              for record in query(repo_file(envelope), attested):
                  item = record.get("t1_item")
                  if type(item) is not int:
                      sys.exit(f"::error::{envelope} has an invalid t1_item {item!r}")
                  inventory = repo_file(record.get("source"))
                  checks.append((item, inventory, envelope, "paths" in record["provenance"]["input"]))

          missing = {1, 8, 9, 10} - {item for item, *_ in checks}
          if missing:
              sys.exit(f"::error::{manifest} is missing inventory attestations for items {sorted(missing)}")

          pinned = (
              'uv run --no-project --with "klayout-tools==$(cat .github/klt-version)" '
              '--with "klayout==$(cat .github/klayout-version)"'
          )
          failed = False
          for item, inventory, envelope, closure in checks:
              attest = ["klt", "signoff", "--attest", str(item), "--inventory", inventory]
              check = [*attest, "--check", envelope]
              print(shlex.join(check), flush=True)
              rc = subprocess.run(check, check=False).returncode
              if rc == 3:
                  if closure:
                      output = '"${new_envelope:?set new_envelope to a new revision path}"'
                      fix = f"Mint an append-only envelope revision, re-pin its path and closure hash in {manifest}, and regenerate the verdict."
                  else:
                      output = shlex.quote(envelope)
                      fix = f"For a member edit, re-attest the envelope. If the inventory changed, also re-pin its hash in {manifest} and regenerate the verdict."
                  command = f"{pinned} {shlex.join(attest)} -o {output}"
                  print(f"::error::Item {item} ({envelope}) is stale. {fix} Run on the signoff host: {command}")
              elif rc:
                  print(f"::error::Item {item} ({envelope}) check exited {rc}")
              failed |= rc != 0
          sys.exit(int(failed))
