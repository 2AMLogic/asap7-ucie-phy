name: klt signoff

# The T1 state of this block is graded, not hand-read: the committed
# verdict of record (manifests/asap7-ucie-phy.signoff.json) must still
# reproduce from the committed block manifest
# (manifests/asap7-ucie-phy.json) under the klayout-tools version pinned in
# .github/klt-version. Every committed JSON file under manifests/ must parse.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate committed JSON parses
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path("manifests").rglob("*.json")):
              try:
                  json.loads(p.read_text())
              except ValueError as e:
                  print(f"::error file={p}::not valid JSON: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Install pinned klt and the klayout module the pad self-test imports
        run: pip install "klayout-tools==$(cat .github/klt-version)" "klayout==0.30.12"

      # klt signoff --check exits 0 when the committed report still
      # reproduces, 3 when it has drifted, anything else is an error.
      - name: Check the committed verdict of record still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/asap7-ucie-phy.json \
                      --check manifests/asap7-ucie-phy.signoff.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::manifests/asap7-ucie-phy.signoff.json is stale. Regenerate and commit it in this PR:"
            echo "  uvx --from \"klayout-tools==\$(cat .github/klt-version)\" klt signoff --manifest manifests/asap7-ucie-phy.json --format json > manifests/asap7-ucie-phy.signoff.json"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --check exited $rc (expected 0 or 3): manifest or report is broken"
            exit 1
          fi

      # A pin that has drifted from its evidence grades stale_evidence, which
      # --check happily reproduces. Fail on any such row in the committed verdict.
      - name: Fail if the committed verdict has stale evidence
        run: |
          if jq -e 'any(.items[]; .reason == "stale_evidence")' manifests/asap7-ucie-phy.signoff.json >/dev/null; then
            echo "::error::the committed verdict has stale_evidence rows: re-pin the cited evidence in manifests/asap7-ucie-phy.json and regenerate the verdict"
            jq -c '.items[] | select(.reason == "stale_evidence") | [.id, .partition]' manifests/asap7-ucie-phy.signoff.json
            exit 1
          fi

      # T1 item 9: re-attest the testbench inventory. The cold start is
      # local_only (ubuntu-latest has no yosys/verilator/iverilog), so it is
      # skipped here; file presence and content hashes still run, so editing
      # any listed testbench fails the build until it is re-attested.
      # Exit 0 = still reproduces, 3 = drifted, anything else is an error.
      - name: Check the item 9 testbench attestation still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --attest 9 --inventory manifests/attest/item9.json \
                      --check manifests/evidence/item9.r2.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::manifests/evidence/item9.r2.json is stale (a listed testbench or the inventory changed). Re-attest on a host with the pinned tools and commit it:"
            echo "  uvx --from \"klayout-tools==\$(cat .github/klt-version)\" klt signoff --attest 9 --inventory manifests/attest/item9.json -o manifests/evidence/item9.r2.json"
            echo "then update the item 9 content_hash in manifests/asap7-ucie-phy.json and regenerate manifests/asap7-ucie-phy.signoff.json."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --attest 9 --check exited $rc (expected 0 or 3)"
            exit 1
          fi

      # Re-verify the item-1 attestation envelope: every inventoried file is
      # re-hashed, and the freshness commands that need no toolchain beyond
      # python3 are re-run. The synthesis freshness command needs Yosys and the
      # pinned ASAP7 archive, so it is local_only: its committed outcome is
      # carried and its netlist is still hash-checked. Exit 3 = drifted.
      - name: Check the item-1 attestation still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --attest 1 --inventory attest/item1.r5.json \
                      --check evidence/item1.r5.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::evidence/item1.r5.json is stale. Regenerate and commit it in this PR:"
            echo "  klt signoff --attest 1 --inventory attest/item1.r5.json -o evidence/item1.r5.json"
            echo "  (then update the content_hash cited in manifests/asap7-ucie-phy.json and regenerate the verdict)"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --attest --check exited $rc (expected 0 or 3)"
            exit 1
          fi

      # Item 10 (repo hygiene): the inventory's declared checks are run by
      # klt itself; --check exits 0 when the committed envelope still
      # reproduces and non-zero on drift or any failing check.
      - name: Check the committed T1 item 10 attestation still reproduces
        run: |
          klt signoff --attest 10 \
                      --inventory manifests/t1-item10-inventory.json \
                      --check manifests/t1-item10.envelope.json
