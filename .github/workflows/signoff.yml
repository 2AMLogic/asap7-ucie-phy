name: klt signoff

# The T1 state of this block is graded, not hand-read: the committed
# verdict of record (manifests/asap7-ucie-phy.signoff.json) must still
# reproduce from the committed block manifest
# (manifests/asap7-ucie-phy.json) under the klayout-tools version pinned in
# .github/klt-version. Every committed JSON file under manifests/ must parse.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate committed JSON parses
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path("manifests").rglob("*.json")):
              try:
                  json.loads(p.read_text())
              except ValueError as e:
                  print(f"::error file={p}::not valid JSON: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Install pinned klt and the klayout module the pad self-test imports
        run: pip install "klayout-tools==$(cat .github/klt-version)" "klayout==$(cat .github/klayout-version)"

      # klt signoff --check exits 0 when the committed report still
      # reproduces, 3 when it has drifted, anything else is an error.
      - name: Check the committed verdict of record still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/asap7-ucie-phy.json \
                      --check manifests/asap7-ucie-phy.signoff.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::manifests/asap7-ucie-phy.signoff.json no longer reproduces from manifests/asap7-ucie-phy.json. Read the drift above before choosing a fix — there are two different causes with two different fixes."
            echo "CAUSE 1 -- the cited EVIDENCE is stale, not the verdict. Tell: the drift lists 'stale_evidence' rows, or a status flipping from met to unmet, or a falling t1_met_count."
            echo "  Re-attest the stale evidence; do NOT regenerate the verdict, which would only record the drift as the verdict of record (and the next step would fail anyway)."
            echo "  Most often this is T1 item 10, whose inventoried members include README.md and .github/workflows/signoff.yml -- see manifests/t1-item10-inventory.json for the full list:"
            echo "    uv run --no-project --with \"klayout-tools==\$(cat .github/klt-version)\" --with \"klayout==\$(cat .github/klayout-version)\" klt signoff --attest 10 --inventory manifests/t1-item10-inventory.json -o manifests/t1-item10.envelope.json"
            echo "  Exception: if item 10 is stale because the inventory itself (manifests/t1-item10-inventory.json) changed, the re-attest above is still required -- it rewrites the envelope's provenance.input.content_hash -- but it is not sufficient: also update item 10's content_hash in manifests/asap7-ucie-phy.json to the new sha256 of the inventory, then regenerate the verdict (CAUSE 2's command). If the envelope was already re-attested, only the re-pin and the regeneration remain."
            echo "CAUSE 2 -- the verdict itself is stale (the manifest changed and the evidence is fine). Regenerate and commit it in this PR:"
            echo "    uvx --from \"klayout-tools==\$(cat .github/klt-version)\" klt signoff --manifest manifests/asap7-ucie-phy.json --format json > manifests/asap7-ucie-phy.signoff.json"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --check exited $rc (expected 0 or 3): manifest or report is broken"
            exit 1
          fi

      # A pin that has drifted from its evidence grades stale_evidence, which
      # --check happily reproduces. Fail on any such row in the committed verdict.
      - name: Fail if the committed verdict has stale evidence
        run: |
          if jq -e 'any(.items[]; .reason == "stale_evidence")' manifests/asap7-ucie-phy.signoff.json >/dev/null; then
            echo "::error::the committed verdict has stale_evidence rows: re-pin the cited evidence in manifests/asap7-ucie-phy.json and regenerate the verdict"
            jq -c '.items[] | select(.reason == "stale_evidence") | [.id, .partition]' manifests/asap7-ucie-phy.signoff.json
            exit 1
          fi

      # T1 item 9: re-attest the testbench inventory. The cold start is
      # local_only (ubuntu-latest has no yosys/verilator/iverilog), so it is
      # skipped here; file presence and content hashes still run, so editing
      # any listed testbench fails the build until it is re-attested.
      # Exit 0 = still reproduces, 3 = drifted, anything else is an error.
      - name: Check the item 9 testbench attestation still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --attest 9 --inventory manifests/attest/item9.json \
                      --check manifests/evidence/item9.r2.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::manifests/evidence/item9.r2.json is stale (a listed testbench or the inventory changed). Re-attest on a host with the pinned tools and commit it:"
            echo "  uvx --from \"klayout-tools==\$(cat .github/klt-version)\" klt signoff --attest 9 --inventory manifests/attest/item9.json -o manifests/evidence/item9.r2.json"
            echo "If a listed testbench changed, stop there: the block manifest and the verdict do NOT need regenerating — item 9's content_hash in manifests/asap7-ucie-phy.json binds the inventory (manifests/attest/item9.json), not the envelope."
            echo "If the inventory itself (manifests/attest/item9.json) changed, update the item 9 content_hash in manifests/asap7-ucie-phy.json and regenerate manifests/asap7-ucie-phy.signoff.json."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --attest 9 --check exited $rc (expected 0 or 3)"
            exit 1
          fi

      # T1 item 8 (characterization report): re-attest the inventory. Its
      # envelope_checks are the cheap ones (hash checks and pure-python
      # re-runs); nothing needs OpenROAD or the PDK. Exit 0 = still
      # reproduces, 3 = drifted, anything else is an error.
      - name: Check the item 8 characterization attestation still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --attest 8 --inventory manifests/attest/item8.json \
                      --check manifests/evidence/item8.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::manifests/evidence/item8.json is stale (the report, a cited envelope or the inventory changed). Identify the drifted check printed above, fix or re-produce that record, then re-attest on a host with the pinned tools and commit:"
            echo "  uvx --from \"klayout-tools==\$(cat .github/klt-version)\" klt signoff --attest 8 --inventory manifests/attest/item8.json -o manifests/evidence/item8.json"
            echo "If the inventory itself (manifests/attest/item8.json) changed, update the item 8 content_hash in manifests/asap7-ucie-phy.json (it binds the inventory, not the envelope) and regenerate manifests/asap7-ucie-phy.signoff.json."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --attest 8 --check exited $rc (expected 0 or 3)"
            exit 1
          fi

      # Re-verify the item-1 attestation envelope: every inventoried file is
      # re-hashed, and the freshness commands that need no toolchain beyond
      # python3 are re-run. The synthesis freshness command needs Yosys and the
      # pinned ASAP7 archive, so it is local_only: its committed outcome is
      # carried and its netlist is still hash-checked. Exit 3 = drifted.
      - name: Check the item-1 attestation still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --attest 1 --inventory attest/item1.r8.json \
                      --check evidence/item1.r8.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::evidence/item1.r8.json is stale. Regenerate and commit it in this PR:"
            echo "  klt signoff --attest 1 --inventory attest/item1.r8.json -o evidence/item1.r8.json"
            echo "  (then update the content_hash cited in manifests/asap7-ucie-phy.json and regenerate the verdict)"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --attest --check exited $rc (expected 0 or 3)"
            exit 1
          fi

      # Item 10 (repo hygiene): the inventory's declared checks are run by
      # klt itself; --check exits 0 when the committed envelope still
      # reproduces, 3 when it has drifted or a declared check now fails, and
      # anything else is an error.
      #
      # README.md and this workflow file are themselves inventoried members, so
      # an ordinary prose or CI edit drifts the envelope. Item 10's content_hash
      # in manifests/asap7-ucie-phy.json binds the *inventory*
      # (manifests/t1-item10-inventory.json), not the envelope file — note the
      # asymmetry: .evidence["10"].file in the block manifest names the
      # envelope, but the pinned hash is of the inventory bytes. That makes two
      # drift cases: an inventoried *member* edit stops at the envelope (no
      # manifest re-pin, no verdict regeneration), while an edit to the
      # *inventory itself* additionally re-pins item 10's content_hash and
      # regenerates manifests/asap7-ucie-phy.signoff.json.
      - name: Check the committed T1 item 10 attestation still reproduces
        run: |
          set -uo pipefail
          rc=0
          klt signoff --attest 10 \
                      --inventory manifests/t1-item10-inventory.json \
                      --check manifests/t1-item10.envelope.json || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::manifests/t1-item10.envelope.json is stale: an inventoried file or the inventory itself changed, or a declared check now fails. README.md and .github/workflows/signoff.yml are themselves inventoried — see manifests/t1-item10-inventory.json for the full member list. Re-attest on a host with the pinned tools and commit the envelope in this PR:"
            echo "  uv run --no-project --with \"klayout-tools==\$(cat .github/klt-version)\" --with \"klayout==\$(cat .github/klayout-version)\" klt signoff --attest 10 --inventory manifests/t1-item10-inventory.json -o manifests/t1-item10.envelope.json"
            echo "If an inventoried member changed, stop there: the block manifest and the verdict do NOT need regenerating — item 10's content_hash in manifests/asap7-ucie-phy.json binds the inventory (manifests/t1-item10-inventory.json), not the envelope."
            echo "If the inventory itself (manifests/t1-item10-inventory.json) changed, update the item 10 content_hash in manifests/asap7-ucie-phy.json and regenerate manifests/asap7-ucie-phy.signoff.json."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::klt signoff --attest 10 --check exited $rc (expected 0 or 3): the inventory, the envelope or the pinned tooling is broken"
            exit 1
          fi
